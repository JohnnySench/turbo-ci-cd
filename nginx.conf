server {
    listen 80;

    server_name my-suite;

    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /promotion/ {
        try_files $uri $uri/ /promotion/index.html;
    }

    location /analytics/ {
        try_files $uri $uri/ /analytics/index.html;
    }
}
